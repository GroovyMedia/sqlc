version: "2"
sql:
  - engine: "duckdb"
    schema: "schema.sql"
    queries: "query.sql"
    gen:
      go:
        package: "querytest"
        out: "go"
        # The Go types are named here so that the generated code shows which
        # columns the join made nullable, whatever the engine maps a type to.
        overrides:
          - db_type: "bigint"
            go_type: "int64"
          - db_type: "bigint"
            nullable: true
            go_type: "database/sql.NullInt64"
          - db_type: "integer"
            go_type: "int32"
          - db_type: "integer"
            nullable: true
            go_type: "database/sql.NullInt32"
          - db_type: "varchar"
            go_type: "string"
          - db_type: "varchar"
            nullable: true
            go_type: "database/sql.NullString"
